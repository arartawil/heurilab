[build-system]
requires = ["setuptools>=64,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heurilab"
dynamic = ["version"]
description = "98 metaheuristic optimization algorithms with a reproducible experiment runner, evaluation-budget fairness, behavioural diagnosis and structural novelty auditing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "HeuriLab Contributors"},
]
keywords = [
    "metaheuristic", "optimization", "swarm-intelligence",
    "evolutionary-algorithm", "benchmark", "convergence",
    "statistical-analysis", "CEC2017", "CEC2022", "parallel",
    "taxonomy", "novelty-detection", "algorithm-similarity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "openpyxl",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]
cec = ["opfunu>=1.0.0"]        # CEC 2005-2022 suites (heurilab.get_opfunu_suite)
parallel = ["joblib"]           # run_experiment(n_jobs=...)
all = ["opfunu>=1.0.0", "joblib"]

[project.urls]
Homepage = "https://github.com/arartawil/heurilab"
Repository = "https://github.com/arartawil/heurilab"
Issues = "https://github.com/arartawil/heurilab/issues"

[tool.setuptools.dynamic]
version = {attr = "heurilab.__version__"}

[tool.setuptools.packages.find]
include = ["heurilab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
